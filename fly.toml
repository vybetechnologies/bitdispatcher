# Fly.io configuration — Lakes Area Security CAD/MDT pilot (Fargo, ND)
# App name must be globally unique on Fly.io; if `las-cad` is taken,
# rename here and in .github/workflows/deploy.yml (fallback: las-cad-fargo).
app = "las-cad"
primary_region = "ord" # Chicago — closest Fly.io region to Fargo, ND

[build]
  dockerfile = "Dockerfile"

[env]
  # Upstream's demo runs with an 800MiB Go memory limit on a 1 GB machine;
  # the recorded map's road graph is most of the memory.
  GOMEMLIMIT = "800MiB"

[http_service]
  internal_port = 8080 # Caddy, inside the container
  force_https = true
  auto_stop_machines = false # dispatch must stay up
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Persistent data: ledger, users, certificate, recorded map.
# Create once before the first deploy (the CI workflow does this):
#   flyctl volumes create las_cad_data --region ord --size 3 --app las-cad
[[mounts]]
  source = "las_cad_data"
  destination = "/var/lib/bitdispatcher"
