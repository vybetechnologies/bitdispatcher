name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: las-cad-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to existing LAS app and persistent volume
        run: flyctl deploy --app las-cad --remote-only --ha=false --yes
      - name: Verify public health and version
        run: |
          curl --fail --retry 5 --retry-delay 5 https://cad.lakesareasecurity.com/api/health
          curl --fail https://cad.lakesareasecurity.com/api/version
